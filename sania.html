<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Perfect Day</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
body{
background:
radial-gradient(circle at 20% 10%,#4b3474 0%,transparent 30%),
radial-gradient(circle at 80% 20%,#163e67 0%,transparent 30%),
linear-gradient(135deg,#090b18,#11152b 50%,#070914);
color:#fff;
}

#game{width:100%;height:100%;position:relative;overflow:hidden}

.stars{position:absolute;inset:0;pointer-events:none}
.star{
position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;
opacity:.5;animation:twinkle 2s infinite alternate
}
@keyframes twinkle{to{opacity:1;transform:scale(1.8)}}

.cloud{
position:absolute;width:180px;height:55px;background:rgba(255,255,255,.12);
border-radius:50px;filter:blur(2px);animation:cloudMove 24s linear infinite
}
.cloud:before,.cloud:after{
content:"";position:absolute;background:inherit;border-radius:50%
}
.cloud:before{width:80px;height:80px;left:30px;top:-35px}
.cloud:after{width:100px;height:100px;right:25px;top:-50px}
.cloud1{top:18%;left:-200px}
.cloud2{top:32%;left:-300px;animation-delay:8s;transform:scale(.7)}
@keyframes cloudMove{from{left:-300px}to{left:110%}}

#sun{
position:absolute;width:180px;height:180px;border-radius:50%;
right:10%;top:7%;
background:radial-gradient(circle,#fff4ad,#ffcb57 45%,rgba(255,180,50,.1) 70%);
box-shadow:0 0 100px #ffcf65;transition:2s
}

#hud{
position:absolute;z-index:20;top:18px;left:25px;right:25px;
display:flex;justify-content:space-between;align-items:center
}
.logo{font-weight:900;letter-spacing:4px;font-size:20px}
.stats{display:flex;gap:12px}
.stat{
background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.15);
padding:9px 15px;border-radius:15px;backdrop-filter:blur(15px);
font-size:13px
}
.stat b{font-size:16px}

#scene{
position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
perspective:1300px
}

.room{
position:relative;width:min(1000px,90vw);height:min(600px,72vh);
transform-style:preserve-3d;
transform:rotateX(2deg);
}

.wall{
position:absolute;inset:0 0 25% 0;
background:
linear-gradient(135deg,rgba(255,255,255,.08),transparent),
linear-gradient(180deg,#1c2440,#10152a);
border:1px solid rgba(255,255,255,.1);
box-shadow:0 30px 70px rgba(0,0,0,.5)
}

.floor{
position:absolute;left:-5%;right:-5%;bottom:0;height:30%;
background:
repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 80px,transparent 80px 160px),
linear-gradient(180deg,#161b2e,#080a15);
transform-origin:top;transform:rotateX(65deg);
border-top:2px solid rgba(255,255,255,.08)
}

.window{
position:absolute;width:270px;height:190px;right:9%;top:12%;
background:linear-gradient(#55a9e9,#193f65 70%,#11192b);
border:10px solid #262c42;
box-shadow:0 0 35px rgba(91,188,255,.2)
}
.window:after{
content:"";position:absolute;inset:0;
background:
linear-gradient(90deg,transparent 48%,rgba(255,255,255,.15) 49% 51%,transparent 52%),
linear-gradient(0deg,transparent 48%,rgba(255,255,255,.15) 49% 51%,transparent 52%)
}
.city{
position:absolute;bottom:0;left:0;right:0;height:45%;
background:repeating-linear-gradient(90deg,#11182a 0 25px,#202844 25px 55px)
}

.curtain{
position:absolute;top:5%;width:85px;height:230px;
background:linear-gradient(90deg,#522c76,#291a42,#613582);
z-index:3
}
.curtain.left{left:7%;border-radius:0 0 50% 20%}
.curtain.right{right:3%;border-radius:0 0 20% 50%}

.bed{
position:absolute;left:10%;bottom:19%;width:480px;height:150px;
transform:translateZ(80px)
}
.mattress{
position:absolute;bottom:0;width:100%;height:75px;
background:linear-gradient(180deg,#e9e8ff,#aaaed2);
border-radius:30px 30px 12px 12px;
box-shadow:0 20px 30px rgba(0,0,0,.4)
}
.blanket{
position:absolute;left:90px;bottom:15px;width:340px;height:90px;
background:linear-gradient(135deg,#6345c4,#3c287e);
border-radius:45px 45px 15px 15px;
animation:blanket 3s ease-in-out infinite
}
@keyframes blanket{50%{transform:translateY(-5px)}}
.pillow{
position:absolute;left:20px;bottom:48px;width:130px;height:60px;
background:#f1f0ff;border-radius:40px;
box-shadow:0 10px 15px rgba(0,0,0,.25)
}

.person{
position:absolute;left:170px;bottom:40px;width:170px;height:75px;
background:linear-gradient(135deg,#27213f,#111222);
border-radius:60px;transform:rotate(-3deg);
animation:sleep 3s ease-in-out infinite
}
.person:before{
content:"";position:absolute;width:58px;height:58px;
background:#d99b76;border-radius:50%;left:10px;top:-18px
}
@keyframes sleep{50%{transform:rotate(-3deg) translateY(-4px)}}

.phone{
position:absolute;width:48px;height:85px;border-radius:8px;
background:#05060a;border:3px solid #777;right:24%;bottom:25%;
transform:rotate(12deg);
box-shadow:0 0 25px rgba(80,150,255,.3)
}

.clock{
position:absolute;left:42%;bottom:24%;font-size:48px;
font-weight:900;text-shadow:0 0 20px #7bc5ff
}

#content{
position:absolute;z-index:30;inset:0;display:flex;
align-items:center;justify-content:center;pointer-events:none
}

.panel{
width:min(720px,90vw);
background:rgba(10,13,30,.78);
border:1px solid rgba(255,255,255,.18);
border-radius:28px;
padding:30px;
backdrop-filter:blur(22px);
box-shadow:0 30px 90px rgba(0,0,0,.55);
pointer-events:auto;
animation:panelIn .5s cubic-bezier(.2,.8,.2,1)
}
@keyframes panelIn{
from{opacity:0;transform:translateY(35px) scale(.94)}
to{opacity:1;transform:none}
}

.kicker{
font-size:12px;letter-spacing:3px;color:#aeb8ff;font-weight:bold;
margin-bottom:8px
}
h1{font-size:42px;margin:5px 0 12px}
h2{font-size:30px;margin:5px 0 10px}
.desc{color:#bfc4d8;line-height:1.5;margin-bottom:22px}

button{
border:0;color:white;cursor:pointer;
font-weight:800;letter-spacing:.5px;
background:linear-gradient(135deg,#7655e8,#477de8);
padding:15px 22px;border-radius:15px;
box-shadow:0 10px 25px rgba(91,83,220,.25);
transition:.2s
}
button:hover{transform:translateY(-3px) scale(1.02)}
button:active{transform:scale(.96)}

.options{
display:grid;grid-template-columns:repeat(3,1fr);gap:13px
}
.option{
padding:18px;border:1px solid rgba(255,255,255,.12);
background:rgba(255,255,255,.055);border-radius:18px;
cursor:pointer;transition:.25s
}
.option:hover{
background:rgba(115,94,235,.2);
transform:translateY(-5px);
border-color:#8f82ff
}
.option strong{display:block;font-size:17px;margin-bottom:7px}
.option span{font-size:12px;color:#aeb4ca}

.progress{
position:absolute;z-index:40;bottom:22px;left:50%;
transform:translateX(-50%);
width:min(600px,75vw);height:7px;
background:rgba(255,255,255,.1);border-radius:20px
}
.progress i{
display:block;height:100%;width:0%;
background:linear-gradient(90deg,#7d61f2,#5bd9ff);
border-radius:20px;transition:.5s
}

#toast{
position:absolute;z-index:100;left:50%;top:100px;
transform:translateX(-50%) translateY(-30px);
padding:12px 20px;border-radius:15px;
background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.15);
opacity:0;transition:.3s;pointer-events:none
}
#toast.show{opacity:1;transform:translateX(-50%)}

.mini{
position:relative;width:100%;height:280px;
background:rgba(255,255,255,.035);
border-radius:22px;border:1px solid rgba(255,255,255,.08);
overflow:hidden;margin:20px 0
}

.cup{
position:absolute;left:50%;top:50%;
transform:translate(-50%,-50%);
width:150px;height:120px;
background:linear-gradient(145deg,#eee,#999);
border-radius:12px 12px 50px 50px;
box-shadow:inset 0 -15px 20px rgba(0,0,0,.2),0 20px 30px rgba(0,0,0,.3);
cursor:pointer
}
.cup:after{
content:"";position:absolute;right:-45px;top:25px;
width:55px;height:60px;border:15px solid #aaa;border-left:0;border-radius:0 40px 40px 0
}
.tea{
position:absolute;left:8px;right:8px;bottom:8px;height:0;
background:linear-gradient(#b96b37,#713715);
border-radius:5px 5px 40px 40px;transition:.2s
}
.steam{
position:absolute;width:6px;height:55px;background:rgba(255,255,255,.25);
border-radius:50%;top:-55px;animation:steam 2s infinite
}
.s1{left:35px}.s2{left:70px;animation-delay:.6s}.s3{left:105px;animation-delay:1s}
@keyframes steam{
0%{transform:translateY(15px);opacity:0}
50%{opacity:.8}
100%{transform:translateY(-20px);opacity:0}
}

.codebox{
font-size:36px;letter-spacing:12px;text-align:center;
background:#080b18;border-radius:16px;padding:20px;
margin-bottom:20px;color:#6ee7ff
}
.codeinputs{display:flex;gap:10px;justify-content:center}
.codeinputs input{
width:55px;height:55px;text-align:center;font-size:25px;
border-radius:12px;border:1px solid #555;background:#101426;color:#fff
}

.kitchen{
display:flex;justify-content:center;align-items:center;gap:35px;height:100%
}
.fooditem{
font-size:65px;cursor:pointer;transition:.2s;user-select:none
}
.fooditem:hover{transform:scale(1.12) rotate(-5deg)}

.knife{
position:absolute;font-size:60px;cursor:pointer;
transition:.1s;user-select:none
}
.sausage{
position:absolute;width:220px;height:42px;background:linear-gradient(#bd633d,#8e432b);
border-radius:25px;left:50%;top:42%;
transform:translateX(-50%);transition:.3s;
z-index:5;
}
.sausage.grilling{
animation:grillSausageAnim 1.2s ease-in-out 3;
background:linear-gradient(#8d3f25,#3f160d)!important;
box-shadow:0 0 18px rgba(255,120,40,.65);
}
.sausage.grilled{
background:linear-gradient(#7d3421,#40170f)!important;
box-shadow:0 0 12px rgba(255,100,30,.45);
}
@keyframes grillSausageAnim{
0%,100%{transform:translateX(-50%) translateY(0) rotate(0deg)}
50%{transform:translateX(-50%) translateY(-7px) rotate(1deg)}
}
.slice{
position:absolute;width:12px;height:48px;background:#73341f;top:39%;
display:none
}

.grill{
position:absolute;left:50%;bottom:25px;transform:translateX(-50%);
width:330px;height:80px;background:#191b20;border-radius:12px;
box-shadow:inset 0 12px 0 #333
}
.grill i{
display:block;height:5px;background:#555;margin:14px 20px;transition:.2s
}
.grill.activeGrill{box-shadow:0 0 28px rgba(255,105,35,.75),inset 0 12px 0 #555}
.grill.activeGrill i{background:#ff7a32;box-shadow:0 0 10px #ff6a28}

.bread{
position:absolute;width:100px;height:65px;background:#d99a51;
border-radius:30px 30px 10px 10px;cursor:pointer;
transition:.3s
}
.bread:hover{transform:rotate(-5deg) scale(1.05)}

.deadline{
display:grid;grid-template-columns:repeat(2,1fr);gap:12px
}
.file{
padding:18px;background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.1);border-radius:15px;
cursor:pointer;position:relative;transition:.2s
}
.file:hover{transform:translateY(-3px)}
.stamp{
position:absolute;right:10px;top:10px;
color:#ff6688;border:2px solid #ff6688;padding:4px 8px;
font-size:11px;font-weight:900;transform:rotate(-12deg);
opacity:0
}
.file.done .stamp{opacity:1}
.file.done{background:rgba(75,200,130,.1)}

.lunch{
display:grid;grid-template-columns:repeat(4,1fr);gap:12px
}
.foodchoice{
font-size:18px;text-align:center;padding:22px 10px;
background:rgba(255,255,255,.05);border-radius:17px;
cursor:pointer;border:1px solid transparent
}
.foodchoice:hover{border-color:#8f82ff;transform:translateY(-4px)}

.phoneScreen{
height:300px;border-radius:25px;background:#080a10;
position:relative;overflow:hidden;border:7px solid #242630;
box-shadow:0 20px 50px rgba(0,0,0,.5)
}
.socialTop{
height:55px;padding:15px;border-bottom:1px solid #252735;
font-weight:bold
}
.scrollContent{padding:18px;animation:scroll 8s linear infinite}
.post{
height:100px;border-radius:16px;background:#1b1e2b;
margin-bottom:15px;padding:15px
}
@keyframes scroll{
from{transform:translateY(0)}
to{transform:translateY(-180px)}
}
.man{
font-size:75px;text-align:center;margin-top:5px;
animation:manScroll .8s infinite alternate
}
@keyframes manScroll{to{transform:translateY(4px)}}

.call{
position:absolute;inset:0;background:linear-gradient(135deg,#17182b,#371827);
display:flex;flex-direction:column;align-items:center;justify-content:center;
animation:callIn .4s
}
@keyframes callIn{from{transform:scale(1.2);opacity:0}to{transform:none;opacity:1}}
.callIcon{font-size:70px;animation:ring .5s infinite alternate}
@keyframes ring{to{transform:rotate(10deg) scale(1.08)}}
.scream{
font-size:20px;font-weight:900;color:#ff5f76;
animation:scream 0.18s infinite alternate
}
@keyframes scream{to{transform:scale(1.05)}}

.puzzle{
display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
margin-top:20px
}
.tile{
height:70px;border-radius:15px;background:#20253a;
display:flex;align-items:center;justify-content:center;
font-size:25px;font-weight:bold;cursor:pointer;
border:1px solid rgba(255,255,255,.08)
}
.tile.active{background:#705be6;transform:scale(.95)}
.timer{
height:8px;background:rgba(255,255,255,.1);border-radius:20px;
margin-top:15px;overflow:hidden
}
.timer i{display:block;height:100%;background:#ff637c;width:100%}

.sky{
position:absolute;inset:0;
background:linear-gradient(#071226,#101a36 55%,#040711);
overflow:hidden
}
.moon{
position:absolute;width:110px;height:110px;border-radius:50%;
background:#fff5cc;right:12%;top:12%;
box-shadow:0 0 60px rgba(255,245,190,.35)
}
.catchStar{
position:absolute;width:64px;height:64px;cursor:pointer;z-index:80;
display:flex;align-items:center;justify-content:center;
animation:starFloat 2.5s ease-in-out infinite,starAppear .35s ease-out;
filter:drop-shadow(0 0 8px #fff4a8) drop-shadow(0 0 22px #ffe36e)
}
.catchStar svg{width:58px;height:58px;display:block;animation:starSpin 4s linear infinite}
@keyframes starFloat{
50%{transform:translateY(-20px) rotate(10deg) scale(1.08)}
}
@keyframes starAppear{
from{opacity:0;transform:scale(0)}
to{opacity:1;transform:scale(1)}
}
@keyframes starSpin{
from{rotate:0deg}
to{rotate:360deg}
}

#start{
position:absolute;z-index:200;inset:0;
display:flex;align-items:center;justify-content:center;
background:radial-gradient(circle at center,rgba(54,50,104,.5),rgba(3,5,14,.96));
backdrop-filter:blur(5px)
}
.startBox{text-align:center}
.startBox h1{
font-size:clamp(55px,9vw,110px);
letter-spacing:8px;
margin:0;
text-shadow:0 0 40px rgba(131,113,255,.7)
}
.startBox p{color:#aeb6d5;font-size:18px;letter-spacing:3px}
.startBox button{font-size:17px;padding:18px 35px}

#result{
position:absolute;z-index:250;inset:0;
display:none;align-items:center;justify-content:center;
background:rgba(4,6,16,.85);backdrop-filter:blur(15px)
}
.resultBox{text-align:center}
.finalScore{font-size:80px;font-weight:900;color:#75ddff}
.award{font-size:20px;color:#cbd0e6;margin:12px}

.particle{
position:absolute;width:7px;height:7px;border-radius:50%;
background:#fff;pointer-events:none;z-index:300;
animation:particle 1s forwards
}
@keyframes particle{
to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}
}

@media(max-width:700px){
.options,.lunch{grid-template-columns:1fr 1fr}
.panel{padding:20px}
h1{font-size:30px}
h2{font-size:25px}
.bed{transform:scale(.75);transform-origin:left bottom}
.window{transform:scale(.7);transform-origin:right top}
}
</style>
</head>

<body>
<div id="game">

<div class="stars" id="stars"></div>
<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
<div id="sun"></div>

<div id="hud">
<div class="logo">PERFECT DAY</div>
<div class="stats">
<div class="stat">PERFECT <b id="score">50</b></div>
<div class="stat">ENERGY <b id="energy">100</b></div>
<div class="stat">TIME <b id="time">07:00</b></div>
</div>
</div>

<div id="scene">
<div class="room">
<div class="wall"></div>
<div class="floor"></div>
<div class="window"><div class="city"></div></div>
<div class="curtain left"></div>
<div class="curtain right"></div>
<div class="bed">
<div class="mattress"></div>
<div class="blanket"></div>
<div class="pillow"></div>
<div class="person"></div>
</div>
<div class="phone"></div>
<div class="clock" id="clock">07:00</div>
</div>
</div>

<div id="content"></div>

<div class="progress"><i id="progress"></i></div>
<div id="toast"></div>

<div id="start">
<div class="startBox">
<div class="kicker">ONE DAY • TEN CHALLENGES</div>
<h1>PERFECT DAY</h1>
<p>Wake up. Survive. Conquer the day.</p>
<button onclick="startGame()">START YOUR DAY →</button>
</div>
</div>

<div id="result">
<div class="resultBox">
<div class="kicker">DAY COMPLETE</div>
<h1>YOU SURVIVED YOUR<br>PERFECT DAY.</h1>
<div class="finalScore" id="finalScore">0</div>
<div class="award" id="award"></div>
<button onclick="location.reload()">PLAY AGAIN</button>
</div>
</div>

</div>

<script>
const content=document.getElementById("content");
const scoreEl=document.getElementById("score");
const energyEl=document.getElementById("energy");
const timeEl=document.getElementById("time");
const progress=document.getElementById("progress");
const toast=document.getElementById("toast");

let score=50,energy=100,stage=0,hour=7,minute=0;
let audioCtx;
let puzzleTimer;
let starsCaught=0;
let sausageCut=0;
let toastTimeout;

for(let i=0;i<70;i++){
const s=document.createElement("div");
s.className="star";
s.style.left=Math.random()*100+"%";
s.style.top=Math.random()*100+"%";
s.style.animationDelay=Math.random()*3+"s";
document.getElementById("stars").appendChild(s);
}

function sound(type){
try{
if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
let o=audioCtx.createOscillator();
let g=audioCtx.createGain();
o.connect(g);g.connect(audioCtx.destination);
let now=audioCtx.currentTime;

if(type==="click"){
o.frequency.value=500;g.gain.setValueAtTime(.08,now);
o.frequency.exponentialRampToValueAtTime(800,now+.08);
g.gain.exponentialRampToValueAtTime(.001,now+.1);
o.start();o.stop(now+.1)
}
if(type==="success"){
o.frequency.value=500;
o.frequency.exponentialRampToValueAtTime(900,now+.25);
g.gain.setValueAtTime(.12,now);
g.gain.exponentialRampToValueAtTime(.001,now+.3);
o.start();o.stop(now+.3)
}
if(type==="wrong"){
o.frequency.value=180;
o.frequency.exponentialRampToValueAtTime(80,now+.25);
g.gain.setValueAtTime(.12,now);
g.gain.exponentialRampToValueAtTime(.001,now+.25);
o.start();o.stop(now+.25)
}
if(type==="ring"){
o.frequency.value=650;
g.gain.setValueAtTime(.12,now);
g.gain.setValueAtTime(.001,now+.15);
g.gain.setValueAtTime(.12,now+.3);
g.gain.setValueAtTime(.001,now+.45);
o.start();o.stop(now+.5)
}
if(type==="scream"){
let freqs=[110,95,150,80,130];
freqs.forEach((f,i)=>{
let x=audioCtx.createOscillator(),gx=audioCtx.createGain();
x.type="sawtooth";x.frequency.value=f;
gx.gain.setValueAtTime(.025,now+i*.08);
gx.gain.exponentialRampToValueAtTime(.001,now+i*.08+.2);
x.connect(gx);gx.connect(audioCtx.destination);
x.start(now+i*.08);x.stop(now+i*.08+.2)
})
}
}catch(e){}
}

function update(){
score=Math.max(0,Math.min(100,score));
energy=Math.max(0,Math.min(100,energy));
scoreEl.textContent=score;
energyEl.textContent=energy;
let h=String(hour).padStart(2,"0"),m=String(minute).padStart(2,"0");
timeEl.textContent=h+":"+m;
document.getElementById("clock").textContent=h+":"+m;
progress.style.width=((stage/10)*100)+"%";
}

function advanceTime(h,m){
minute+=m;
hour+=h+Math.floor(minute/60);
minute%=60;
update()
}

function msg(t){
toast.textContent=t;
toast.classList.add("show");
clearTimeout(toastTimeout);
toastTimeout=setTimeout(()=>toast.classList.remove("show"),1800)
}

function particles(x=innerWidth/2,y=innerHeight/2){
for(let i=0;i<18;i++){
let p=document.createElement("div");
p.className="particle";
p.style.left=x+"px";
p.style.top=y+"px";
p.style.setProperty("--x",(Math.random()*300-150)+"px");
p.style.setProperty("--y",(Math.random()*300-150)+"px");
document.body.appendChild(p);
setTimeout(()=>p.remove(),1000)
}
}

function startGame(){
document.getElementById("start").style.display="none";
sound("success");
stage=1;
showWakeQuestion()
}

function panel(html){

function showCooking(){
advanceTime(0,10);

panel(`
<div class="kicker">BREAKFAST MINI-GAME</div>
<h2>🍳 Breakfast Master</h2>
<div class="desc">Cut the sausage into pieces, then grill it and toast the bread.</div>
<div class="mini">

<div id="knife" class="knife" style="left:22%;top:30%" onclick="cutSausage()">🔪</div>
<div class="grill" id="grill" onclick="grillSausage()">
<i></i><i></i><i></i>
<div style="text-align:center;color:#777">GRILL</div>
</div>

</div>

<span id="cookStatus">Cut sausage: 0/3</span>
<span>🔥 Grill + 🍞 Toast</span>
</div>
`)

function cutSausage(){
if(sausageCut>=3)return;
sausageCut++;
sound("click");
let s=document.getElementById("sausage");
s.style.background="linear-gradient(90deg,#bd633d "+(sausageCut*25)+"%,#71341f "+(sausageCut*25)+"%)";
document.getElementById("cookStatus").textContent="Cut sausage: "+sausageCut+"/3";
if(sausageCut===3)msg("Sausage cut! Now grill it 🔥")
}

let grilled=false,toasted=false;

function grillSausage(){
if(sausageCut<3){msg("Cut it first! 🔪");sound("wrong");return}
if(grilled)return;
let s=document.getElementById("sausage");
let g=document.getElementById("grill");
if(!s||!g)return;
s.classList.add("grilling");
g.classList.add("activeGrill");
sound("click");
msg("🔥 Grilling the sausage...");
setTimeout(()=>{
s.classList.remove("grilling");
s.classList.add("grilled");
g.classList.remove("activeGrill");
grilled=true;
document.getElementById("cookStatus").textContent="Sausage grilled! Now toast the bread 🍞";
sound("success");
},1800);
}

function toastBread(){
if(!grilled){msg("Grill the sausage first!");sound("wrong");return}
if(toasted)return;
toasted=true;
document.getElementById("bread").style.background="#77401f";
document.getElementById("bread").textContent="🍞🔥";
score+=12;energy+=7;
sound("success");particles();
msg("Breakfast COMPLETE! +12");

let puzzleOrder=[],puzzleNext=0,puzzleStart;

function createPuzzle(){
let nums=[...Array(9)].map((_,i)=>i+1).sort(()=>Math.random()-.5);
puzzleOrder=nums.slice().sort((a,b)=>a-b);
puzzleNext=0;

let p=document.getElementById("puzzle");

nums.forEach(n=>{
let t=document.createElement("div");
t.className="tile";
t.textContent=n;

t.onclick=()=>{
if(n===puzzleOrder[puzzleNext]){
t.classList.add("active");
sound("click");
puzzleNext++;

if(puzzleNext===9){
clearInterval(puzzleTimer);
score+=15;
energy+=5;
sound("success");
particles();
msg("YOU ARE SAFE! 😎");
setTimeout(showBedQuestion,800)
}
}else{
sound("wrong");
score-=3;
t.animate(
[
{transform:"translateX(-8px)"},
{transform:"translateX(8px)"},
{transform:"translateX(0)"}
],200)
}
};

p.appendChild(t)
});

let left=15;
puzzleStart=Date.now();

puzzleTimer=setInterval(()=>{
left=15-Math.floor((Date.now()-puzzleStart)/1000);
document.getElementById("timer").style.width=(left/15*100)+"%";

if(left<=0){
clearInterval(puzzleTimer);
showAngryEx()
}
},100)
}

let starInterval;

function showStars(){
content.innerHTML=`
<div class="sky">
<div class="moon"></div>
<div style="position:absolute;left:50%;top:15%;transform:translateX(-50%);text-align:center">
<div class="kicker">FINAL MINI-GAME</div>
<h2>CATCH THE SLEEPY STARS ✨</h2>
<div style="color:#aeb6d5">Catch 7 stars before they disappear.</div>
<div style="margin-top:8px">CAUGHT: <b id="caught">0</b> / 7</div>
</div>
</div>`;

starsCaught=0;
starInterval=setInterval(spawnCatchStar,500);
}

function spawnCatchStar(){

if(starsCaught>=7){
clearInterval(starInterval);
setTimeout(showResult,700);
return;
}

let s=document.createElement("div");
s.className="catchStar";

s.innerHTML=`
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<polygon points="50,3 61,36 96,36 68,57 79,94 50,72 21,94 32,57 4,36 39,36"
fill="#fff2a6"
stroke="#fff"
stroke-width="3"
stroke-linejoin="round"/>
<circle cx="34" cy="28" r="5" fill="#fff"/>
</svg>`;

s.style.left=(10+Math.random()*80)+"%";
s.style.top=(25+Math.random()*55)+"%";

s.onclick=()=>{
starsCaught++;
score+=2;

document.getElementById("caught").textContent=starsCaught;

sound("click");
particles(
s.getBoundingClientRect().left,
s.getBoundingClientRect().top
);

s.remove();

if(starsCaught>=7){
clearInterval(starInterval);
msg("ALL STARS CAUGHT! 🌟");
sound("success");
setTimeout(showResult,600);
}
};

document.getElementById("game").appendChild(s);

setTimeout(()=>s.remove(),3500);
}

function showResult(){
progress.style.width="100%";
content.innerHTML="";
document.getElementById("result").style.display="flex";
document.getElementById("finalScore").textContent=score;

let award;

if(score>=100)
award="🏆 PERFECT DAY MASTER — Absolutely legendary.";
else if(score>=85)
award="🥇 DAY CONQUEROR — You handled the chaos.";
else if(score>=70)
award="🥈 SURVIVOR — Somehow everything worked out.";
else if(score>=50)
award="🥉 FUNCTIONAL HUMAN — It could have been worse.";
else
award="💀 CHAOS CHAMPION — That was definitely a day.";

document.getElementById("award").textContent=award;

particles(innerWidth/2,innerHeight/2);
sound("success")
}

update();
</script>
